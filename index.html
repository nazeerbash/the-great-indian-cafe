// ScrollFilm: one section = tall container + sticky stage + (video | placeholder) + cue text
const NS='http://www.w3.org/2000/svg',vb=MOB?'8 0 84 100':'0 0 100 100',films=[];
class ScrollFilm{
 constructor(f,i){this.f=f;this.p=-1;this.vis=false;this.v=null;this.ready=false;
  const s=document.createElement('section');s.className='film'+(f.id==='hero'?' hero':'');s.id=f.id;s.style.height=RM?'auto':f.vh[+MOB]+'vh';s.style.background=f.bg;
  s.setAttribute('aria-label',f.alt);
  const cues=f.cues.map((c,k)=>{const T=i===0||c.h&&k===0?'h2':'p';return `<div class="cue ${c.pos}" data-k="${k}">${c.h?`<${i===0?'h1':'h2'} class="h ${c.xl?'xl':''} ${c.sm?'sm':''}">${c.h}</${i===0?'h1':'h2'}>`:''}${c.s?`<p class="sub">${c.s}</p>`:''}${c.p?`<p class="eb">${c.p}</p>`:''}</div>`}).join('');
  s.innerHTML=`<div class="stage"><svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"></svg>${cues}</div>`;
  this.el=s;this.stage=s.firstChild;this.svg=this.stage.querySelector('svg');this.cues=[...this.stage.querySelectorAll('.cue')];
  this.build();document.getElementById('films').appendChild(s)}
 build(){const f=this.f;let h='';
  (f.ribbons||[]).forEach(r=>h+=`<path d="${r.d}" fill="none" stroke="${r.c}" stroke-width="${r.w}" stroke-linecap="round" pathLength="100" class="rb"/>`);
  f.items.forEach(it=>{const[n,c,r,,,,,,lab,sh,rot]=it,shp=sh==='t'?`<polygon points="0,${-r} ${r*.95},${r*.7} ${-r*.95},${r*.7}" fill="${c}" stroke="#2B2320" stroke-opacity=".18" stroke-width=".15"/>`:sh==='r'?`<rect x="${-r*.09}" y="${-r}" width="${r*.18}" height="${r*2}" rx=".3" fill="${c}"/>`:`<circle r="${r}" fill="${c}" stroke="#2B2320" stroke-opacity=".18" stroke-width=".15"/><circle r="${r*.72}" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width=".25"/>${f.char?`<circle r="${r}" fill="#2B2320" class="ch" opacity="0"/>`:''}`;
   h+=`${f.lines&&lab?'<line class="ln" opacity="0"/>':''}<g class="i">${shp}</g>${lab?`<text class="lb" opacity="0">${n}</text>`:''}`});
  this.svg.innerHTML=h;let k=0;this.nodes=f.items.map(it=>{const g=this.svg.querySelectorAll('.i')[k++];return{g,ch:g.querySelector('.ch'),t:it[8]?g.nextElementSibling:null,ln:f.lines&&it[8]?g.previousElementSibling:null}});this.rbs=[...this.svg.querySelectorAll('.rb')]}
 draw(p){const f=this.f;
  f.items.forEach((it,i)=>{const[n,c,r,fx,fy,tx,ty,s,lab,sh,rot]=it,n_=this.nodes[i],e=E(C((p-s)/(.85-s))),x=L(fx,tx,e),y=L(fy,ty,e),o=s>0&&f.id!=='table'&&f.id!=='fire'?C((p-s)*8):1;
   n_.g.setAttribute('transform',`translate(${x} ${y}) rotate(${(rot||0)*e})`);n_.g.setAttribute('opacity',o);if(n_.ch)n_.ch.setAttribute('opacity',(e*.55).toFixed(3));
   if(n_.t){const w=Array.isArray(lab)?lab:[.8,2],on=p>=w[0]&&p<=w[1]&&e>.6?1:0;n_.t.setAttribute('x',x);n_.t.setAttribute('y',y+r+3.4);n_.t.setAttribute('opacity',on);
    if(n_.ln){n_.ln.setAttribute('x1',50);n_.ln.setAttribute('y1',50);n_.ln.setAttribute('x2',x);n_.ln.setAttribute('y2',y);n_.ln.setAttribute('opacity',on?.4:0)}}});
  this.rbs.forEach((r,i)=>{const d=f.ribbons[i];if(d.m==='draw'){const q=C(p*1.15);r.setAttribute('stroke-dasharray',`${q*100} 100`)}else r.setAttribute('stroke-opacity',d.o*C(p*1.6))})}
 cue(p){this.f.cues.forEach((c,k)=>{this.cues[k].style.opacity=RM?1:Math.min(1,Math.max(0,Math.min((p-c.a)/.08,(c.b-p)/.08)))})}
 update(){const r=this.el.getBoundingClientRect(),span=this.el.offsetHeight-this.stage.offsetHeight;let p=RM?this.f.still:C(-r.top/Math.max(1,span));
  if(p===this.p&&!this.retry)return;this.p=p;this.retry=false;this.draw(p*(this.f.cap||1));this.cue(p);
  if(this.v&&this.ready&&this.v.readyState>=1&&!this.v.seeking&&this.v.duration){const t=p*(this.f.cap||1)*(this.v.duration-.05);if(Math.abs(this.v.currentTime-t)>.03)this.v.currentTime=t;else{}}}
 load(){if(this.v||RM)return;const src=this.f.media[MOB?'m':'d'];if(!src.length)return; // placeholder stays
  const v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.playsInline=true;v.preload='auto';v.loop=false;
  v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.disablePictureInPicture=true;v.setAttribute('aria-hidden','true');
  src.forEach(s=>{const o=document.createElement('source');o.src=s.src;o.type=s.type;v.appendChild(o)});
  const ok=()=>{if(this.ready)return;this.ready=true;this.stage.classList.add('ready');this.retry=true;dirty=true};
  ['loadeddata','canplay','canplaythrough'].forEach(ev=>v.addEventListener(ev,ok));
  v.addEventListener('seeked',()=>{this.retry=true;dirty=true});
  v.addEventListener('error',()=>{this.ready=false;this.stage.classList.remove('ready')});
  this.prime=()=>{if(this.ready&&v.readyState>=2)return;try{const pr=v.play();if(pr&&pr.then)pr.then(()=>v.pause()).catch(()=>{})}catch(e){}};
  this.v=v;this.stage.prepend(v);v.load();this.prime();setTimeout(()=>this.prime(),600)}}
FILMS.forEach((f,i)=>films.push(new ScrollFilm(f,i)));
let dirty=true;addEventListener('scroll',()=>dirty=true,{passive:true});addEventListener('resize',()=>dirty=true);addEventListener('orientationchange',()=>dirty=true);
const io=new IntersectionObserver(es=>es.forEach(e=>{const fl=films.find(x=>x.el===e.target);fl.vis=e.isIntersecting;if(e.isIntersecting){fl.load();dirty=true}}),{rootMargin:'100% 0px'});
films.forEach(f=>io.observe(f.el));
['touchstart','pointerdown','scroll','keydown'].forEach(ev=>addEventListener(ev,()=>films.forEach(f=>f.v&&!f.ready&&f.prime&&f.prime()),{passive:true,once:ev!=='scroll'}));
const hd=$('#hd');
(function tick(){if(dirty){dirty=false;films.forEach(f=>f.vis&&f.update());hd.classList.toggle('sc',scrollY>40)}requestAnimationFrame(tick)})();

$('#nl').addEventListener('click',()=>{$('#nv').classList.remove('open');$('#mb').setAttribute('aria-expanded',false)});
